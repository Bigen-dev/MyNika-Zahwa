<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Detail</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
            background-color: #f3f0f7;
    background-image: 
        radial-gradient(at 0% 0%, rgba(68, 255, 140, 0.682) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(247, 251, 45, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgb(234, 243, 172) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgb(255, 88, 247) 0px, transparent 50%);
        background-attachment: fixed;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Styling Panel Input */
        .input-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* Styling Tabel */
        .table-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.02);
        }

        h2 {
            font-weight: 700;
            color: #1a202c;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 1.2rem;
        }

        /* Form Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3498db;
        }

        button {
            padding: 11px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            overflow: hidden;
            border-radius: 12px;
            margin-top: 10px;
        }

        thead {
            background-color: #3498db;
            color: #ffffff;
        }

        th {
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.95rem;
            color: #4a5568;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .row-total {
            background-color: #edfcf2 !important;
            font-weight: 700;
            color: #276749;
            border-top: 2px solid #2ecc71;
        }

        .row-total td {
            color: #276749;
            font-size: 1rem;
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            th, td {
                padding: 10px;
                font-size: 0.8rem;
            }
        }
        nav {
  padding: 10px;
  text-align: center;
  font-family:arial;
  border: #333;
}

nav a {
  background-color:aqua ;
  color: rgb(0, 0, 0);
  padding: 8px 15px;
  text-decoration: none;
  border-radius: 5px;
  margin: 3px;
}
nav a:hover {
  color: rgb(255, 255, 255);
}

    </style>
</head>
<body>

            <a href="home.html">Home</a>

            <a href="Galeri.html">Galeri</a>
        </nav></center>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        
        <div class="input-card">
            <h2>Tambah Catatan Baru</h2>
            <form id="savingForm" onsubmit="addDataToFirebase(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tanggal">Tanggal</label>
                        <input type="date" id="tanggal" required>
                    </div>
                    <div class="form-group">
                        <label for="hasbi">Tabungan Hasbi (Rp)</label>
                        <input type="number" id="hasbi" placeholder="Contoh: 100000" required>
                    </div>
                    <div class="form-group">
                        <label for="zahwa">Tabungan Zahwa (Rp)</label>
                        <input type="number" id="zahwa" placeholder="Contoh: 100000" required>
                    </div>
                    <button type="submit">Tambah Catatan</button>
                </div>
            </form>
        </div>

        <div class="table-card">
            <h2>Riwayat Tabungan</h2>
            <table>
                <thead>
                    <tr>
                        <th style="text-align: center; width: 50px;">No</th>
                        <th>Tanggal</th>
                        <th>Hasbi</th>
                        <th>Zahwa</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
                <tfoot>
                    <tr class="row-total">
                        <td colspan="2" style="text-align: right;">Total Keseluruhan:</td>
                        <td id="grandTotalHasbi">Rp 0</td>
                        <td id="grandTotalZahwa">Rp 0</td>
                        <td id="grandTotalAll">Rp 0</td>
                    </tr>
                </tfoot>
            </table>
            
            <button class="btn-danger" onclick="clearFirebaseData()">Hapus Semua Riwayat</button>
        </div>

    </div>
    <script>
        // =============================================================
        // MASUKKAN CONFIG FIREBASE MILIK ANDA DI SINI
        // =============================================================
        const firebaseConfig = {
               apiKey: "AIzaSyCWGvQ1CVbj1B14eE3nJYrqluJ-QVIOpTs",
    authDomain: "nikaproject-fb7fe.firebaseapp.com",
    databaseURL: "https://nikaproject-fb7fe-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nikaproject-fb7fe",
    storageBucket: "nikaproject-fb7fe.firebasestorage.app",
    messagingSenderId: "1085097655469",
    appId: "1:1085097655469:web:7eb07eb35f57a44e1e9a24",
    measurementId: "G-1B69MD25J3"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tabunganRef = database.ref('dataTabungan');

        // 1. Ambil Data Realtime dari Firebase Cloud
        tabunganRef.on('value', function(snapshot) {
            const data = snapshot.val();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = ""; 

            let totalHasbiAll = 0;
            let totalZahwaAll = 0;
            let grandTotalAll = 0;
            let index = 1;

            if (data) {
                for (let key in data) {
                    let item = data[key];
                    let totalBaris = item.hasbi + item.zahwa;

                    totalHasbiAll += item.hasbi;
                    totalZahwaAll += item.zahwa;
                    grandTotalAll += totalBaris;

                    const newRow = document.createElement('tr');
                    newRow.innerHTML = `
                        <td style="text-align: center;">${index}</td>
                        <td>${item.tanggal}</td>
                        <td>Rp ${item.hasbi.toLocaleString('id-ID')}</td>
                        <td>Rp ${item.zahwa.toLocaleString('id-ID')}</td>
                        <td><strong>Rp ${totalBaris.toLocaleString('id-ID')}</strong></td>
                    `;
                    tableBody.appendChild(newRow);
                    index++;
                }
            }

            // Update footer total
            document.getElementById('grandTotalHasbi').innerText = "Rp " + totalHasbiAll.toLocaleString('id-ID');
            document.getElementById('grandTotalZahwa').innerText = "Rp " + totalZahwaAll.toLocaleString('id-ID');
            document.getElementById('grandTotalAll').innerText = "Rp " + grandTotalAll.toLocaleString('id-ID');
        });

        // 2. Simpan Data Baru ke Firebase Cloud
        function addDataToFirebase(event) {
            event.preventDefault();

            const tanggalInput = document.getElementById('tanggal').value;
            const hasbiInput = parseInt(document.getElementById('hasbi').value) || 0;
            const zahwaInput = parseInt(document.getElementById('zahwa').value) || 0;

            const dateObj = new Date(tanggalInput);
            const formattedDate = dateObj.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            // Kirim ke database Firebase
            tabunganRef.push({
                tanggal: formattedDate,
                hasbi: hasbiInput,
                zahwa: zahwaInput
            });

            document.getElementById('savingForm').reset();
        }

        // 3. Hapus Data dari Firebase Cloud
        function clearFirebaseData() {
            if (confirm("Apakah Anda yakin ingin menghapus semua riwayat di database cloud?")) {
                tabunganRef.remove();
            }
        }
    </script>
    

</body>
</html>
